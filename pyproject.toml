[project]
name = "ai-document-evals-demo"
version = "0.1.0"
description = "Production B2B contract extraction with calibrated confidence scoring, human-in-the-loop triage, and deterministic regression evals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pdfplumber>=0.11.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
